<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Check-in Equip · 3×3 Westfield Glòries 2026</title>
<meta name="robots" content="noindex,nofollow"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#020817;color:#f8fafc;min-height:100vh}
.header{border-bottom:1px solid rgba(255,255,255,.1);background:rgba(2,8,23,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:50;padding:0 16px}
.header-inner{max-width:640px;margin:0 auto;height:56px;display:flex;align-items:center;justify-content:space-between}
.back{color:rgba(255,255,255,.4);font-size:13px;font-weight:500;text-decoration:none;display:flex;align-items:center;gap:6px}
.back:hover{color:white}
.badge-check{font-size:11px;font-weight:800;font-family:monospace;color:#ef4444;letter-spacing:4px;text-transform:uppercase}
.wrap{max-width:640px;margin:0 auto;padding:32px 16px 48px}
/* Banners */
.banner-ok{background:rgba(34,197,94,.1);border:2px solid rgba(34,197,94,.5);border-radius:16px;padding:18px;display:flex;align-items:center;gap:14px;margin-bottom:24px;animation:slideIn .3s ease}
.banner-pendent{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:16px;padding:14px 18px;display:flex;align-items:center;gap:12px;margin-bottom:24px}
.check-circle{width:44px;height:44px;border-radius:50%;background:#22c55e;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px}
.banner-ok-t{font-weight:800;color:#4ade80;text-transform:uppercase;letter-spacing:1px;font-size:12px}
.banner-ok-s{color:rgba(255,255,255,.6);font-size:12px;margin-top:2px}
.alert-ic{font-size:18px;flex-shrink:0;color:#f87171}
.banner-pendent p{font-size:13px;color:rgba(255,255,255,.75)}
/* Targeta principal */
.card{background:linear-gradient(135deg,rgba(239,68,68,.15) 0%,rgba(15,23,42,.6) 50%,rgba(15,23,42,1) 100%);border:1px solid rgba(239,68,68,.25);border-radius:24px;padding:24px;margin-bottom:20px}
.team-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:4px;color:#fca5a5;margin-bottom:4px}
.team-name{font-size:clamp(28px,8vw,40px);font-weight:900;line-height:1.1;margin-bottom:16px}
.team-id{font-size:10px;font-family:monospace;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.6);padding:4px 10px;border-radius:6px;display:inline-block;margin-bottom:20px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:400px){.fields{grid-template-columns:1fr}}
.field{background:rgba(255,255,255,.06);border-radius:10px;padding:12px}
.field-lbl{font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.field-val{font-size:14px;font-weight:600}
/* Botó */
.btn-arrived{width:100%;padding:18px;border-radius:14px;border:none;font-size:16px;font-weight:800;cursor:pointer;letter-spacing:.5px;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px}
.btn-arrived.pendent{background:#22c55e;color:white}
.btn-arrived.pendent:hover{background:#16a34a;transform:translateY(-1px);box-shadow:0 8px 24px rgba(34,197,94,.3)}
.btn-arrived.pendent:active{transform:translateY(0)}
.btn-arrived.done{background:rgba(34,197,94,.15);color:#4ade80;border:2px solid rgba(34,197,94,.3);cursor:default}
.btn-arrived.loading{background:rgba(34,197,94,.4);cursor:wait}
/* Configuració webhook */
.cfg-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:16px;margin-bottom:20px}
.cfg-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:rgba(255,255,255,.4);margin-bottom:10px}
.cfg-row{display:flex;gap:8px}
.cfg-input{flex:1;padding:8px 10px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:white;font-size:12px;font-family:monospace}
.cfg-input::placeholder{color:rgba(255,255,255,.25)}
.cfg-btn{padding:8px 14px;background:#ef4444;color:white;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.cfg-btn:hover{background:#dc2626}
.no-params{text-align:center;padding:60px 20px;color:rgba(255,255,255,.4)}
.no-params h2{font-size:18px;margin-bottom:8px;color:rgba(255,255,255,.6)}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <a class="back" href="https://cbgrupbarna-3x3timechamber.com">← 3×3 Westfield Glòries</a>
    <span class="badge-check">Check-in</span>
  </div>
</div>
<div class="wrap" id="main"></div>

<script>
const WEBHOOK_KEY = 'checkin_webhook_url';
const p = new URLSearchParams(location.search);
const id       = p.get('id')       || '';
const nom      = p.get('nom')      || '';
const cat      = p.get('cat')      || '';
const cap      = p.get('cap')      || '';
const pob      = p.get('pob')      || '';
const jug      = p.get('jug')      || '';
const mida     = p.get('mida')     || '';
const tel      = p.get('tel')      || '';
const email    = p.get('email')    || '';
const data     = p.get('data')     || '';
const pagat    = p.get('pagat')    || '';
const dia      = p.get('dia')      || '';
const jugadors = p.get('jugadors') || '';
const talles   = p.get('talles')   || '';

const arrivedKey = id ? 'checkin_arrived_' + id : null;
let arrived = arrivedKey ? localStorage.getItem(arrivedKey) === '1' : false;

function render() {
  const el = document.getElementById('main');
  if (!nom && !id) {
    el.innerHTML = `
      <div class="no-params">
        <h2>QR no vàlid</h2>
        <p>Escaneja el QR del teu equip des del correu de confirmació.</p>
      </div>`;
    return;
  }

  const webhook = localStorage.getItem(WEBHOOK_KEY) || '';
  const fields = [
    {lbl:'🏆 Categoria', val: cat},
    {lbl:'📅 Dia',       val: dia || data},
    {lbl:'👤 Capità',    val: cap},
    {lbl:'👥 Jugadors',  val: jug ? jug + ' jugadors' : ''},
    {lbl:'👕 Samarreta', val: mida},
    {lbl:'📍 Població',  val: pob},
  ].filter(f => f.val);

  const isStaff = location.search.includes('staff=1');

  // Llista de jugadors amb talles
  const jugList = jugadors ? jugadors.split(',').map(s=>s.trim()).filter(Boolean) : [];
  const tallesList = talles ? talles.split(',').map(s=>s.trim()) : [];
  const jugHtml = jugList.length > 0 ? `
    <div style="margin-top:14px;">
      <div style="font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;">👥 Jugadors</div>
      ${jugList.map((j,i) => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px;">
          <span style="color:rgba(255,255,255,.85)">${i+1}. ${esc(j)}</span>
          ${tallesList[i] ? `<span style="font-size:11px;font-weight:700;background:rgba(200,16,46,.25);color:#fca5a5;padding:2px 8px;border-radius:6px;">${esc(tallesList[i])}</span>` : ''}
        </div>`).join('')}
    </div>` : '';

  // Estat de pagament — només mostrem si VERIFICAT, mai el pendent (el comprova l'organitzador)
  const pagatHtml = pagat === '1'
    ? `<div style="background:rgba(34,197,94,.1);border:1.5px solid rgba(34,197,94,.4);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;">
         <span style="font-size:20px;">✅</span>
         <div><div style="font-weight:800;color:#4ade80;font-size:12px;text-transform:uppercase;letter-spacing:.5px;">Pagament verificat</div>
         <div style="color:rgba(255,255,255,.5);font-size:11px;">Import confirmat per CB Grup Barna</div></div>
       </div>`
    : '';

  el.innerHTML = `
    ${arrived
      ? `<div class="banner-ok">
           <div class="check-circle">✓</div>
           <div><div class="banner-ok-t">Equip registrat</div>
           <div class="banner-ok-s">Samarretes entregades. Tot a punt per jugar!</div></div>
         </div>`
      : `<div class="banner-pendent">
           <span class="alert-ic">⚠️</span>
           <p>Equip pendent de check-in. Verifica les dades i prem el botó verd.</p>
         </div>`
    }
    ${pagatHtml}
    <div class="card">
      <div class="team-label">Equip</div>
      <div class="team-name">${esc(nom)}</div>
      ${id ? `<div class="team-id">ID: ${esc(id)}</div>` : ''}
      <div class="fields">
        ${fields.map(f=>`<div class="field"><div class="field-lbl">${f.lbl}</div><div class="field-val">${esc(f.val)}</div></div>`).join('')}
        ${tel ? `<div class="field"><div class="field-lbl">📞 Telèfon</div><div class="field-val"><a href="tel:${esc(tel)}" style="color:#93c5fd">${esc(tel)}</a></div></div>` : ''}
        ${email ? `<div class="field"><div class="field-lbl">✉️ Email</div><div class="field-val" style="font-size:12px;word-break:break-all">${esc(email)}</div></div>` : ''}
      </div>
      ${jugHtml}
    </div>
    ${!arrived
      ? `<button class="btn-arrived pendent" id="btn-checkin" onclick="marcarArribada()">
           ✅ Marcar com a arribat · Entregar samarretes
         </button>`
      : `<button class="btn-arrived done" disabled>
           ✓ Equip ja registrat
         </button>`
    }
    ${isStaff && !webhook ? `
      <div class="cfg-box">
        <div class="cfg-title">⚙️ Configuració webhook (staff)</div>
        <div class="cfg-row">
          <input class="cfg-input" id="wh-input" placeholder="https://script.google.com/macros/s/..." value="${esc(webhook)}"/>
          <button class="cfg-btn" onclick="saveWebhook()">Desar</button>
        </div>
      </div>` : ''}
    `;
}

async function marcarArribada() {
  if (!id || arrived) return;
  const btn = document.getElementById('btn-checkin');
  if (btn) { btn.className = 'btn-arrived loading'; btn.innerHTML = '<span class="spinner"></span> Registrant...'; }
  try {
    const webhook = localStorage.getItem(WEBHOOK_KEY);
    if (webhook) {
      await fetch(webhook, {
        method: 'POST', mode: 'no-cors',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({action:'checkin', teamId:id, nomEquip:nom, categoria:cat, timestamp:new Date().toISOString(), local:new Date().toLocaleString('ca-ES')})
      });
    }
    if (arrivedKey) localStorage.setItem(arrivedKey, '1');
    arrived = true;
    render();
  } catch(e) {
    if (btn) { btn.className = 'btn-arrived pendent'; btn.innerHTML = '✅ Marcar com a arribat · Entregar samarretes'; }
    alert('Error de connexió. Torna a provar.');
  }
}

function saveWebhook() {
  const v = document.getElementById('wh-input')?.value?.trim();
  if (v) { localStorage.setItem(WEBHOOK_KEY, v); render(); }
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
