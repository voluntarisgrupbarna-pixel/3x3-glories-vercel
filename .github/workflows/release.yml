name: Release

# S'activa quan es fa push d'un tag semàntic (v1.2.0, v2.0.0, etc.)
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Crear GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extreure notes del CHANGELOG
        id: notes
        run: |
          # Extreu la secció del CHANGELOG per a la versió actual
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## \[${VERSION}\]/{found=1;next} found && /^## \[/{exit} found{print}" CHANGELOG.md > /tmp/notes.md
          # Si no hi ha notes, posa un missatge genèric
          if [ ! -s /tmp/notes.md ]; then
            echo "Veure [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) per als detalls." > /tmp/notes.md
          fi
          cat /tmp/notes.md

      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "🏀 ${{ github.ref_name }} — 3×3 Westfield Glòries 2026" \
            --notes-file /tmp/notes.md
